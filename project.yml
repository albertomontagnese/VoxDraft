name: VoxDraft
options:
  bundleIdPrefix: com.albertomontagnese
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  VoxDraft:
    type: application
    platform: macOS
    sources:
      - path: VoxDraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albertomontagnese.VoxDraft
        INFOPLIST_FILE: VoxDraft/Info.plist
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
